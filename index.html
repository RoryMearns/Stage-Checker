<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage Checker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-banner">
    <div class="container banner-inner">
        <img src="images/shag.svg" alt="The Friendly Shag" class="banner-logo is-hidden-mobile">
        <span class="banner-title">The Friendly Shag</span>
    </div>
</header>
<section class="section">
    <div class="container">
        <div id="loading" class="notification is-info">
            <p>Loading data...</p>
        </div>

        <div id="error" class="notification is-danger" style="display: none;">
            <button class="delete"></button>
            <p id="error-message"></p>
        </div>

        <div id="runs-container" style="display: none;"></div>
    </div>
</section>

<script type="module" src="js/main.js"></script>
</body>
</html>
